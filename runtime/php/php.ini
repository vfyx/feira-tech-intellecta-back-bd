[PHP]
date.timezone=America/Sao_Paulo
memory_limit=256M
upload_max_filesize=8M
post_max_size=10M
display_errors=Off
log_errors=On
extension=curl
extension=fileinfo
extension=gd
extension=intl
extension=mbstring
extension=exif
extension=openssl
extension=pdo_pgsql
extension=pgsql
extension=sodium

allow_url_fopen = On

extension_dir = "ext"
extension=zip